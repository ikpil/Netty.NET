name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.framework }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        framework: [net10.0, net11.0]
        include:
          - framework: net10.0
            sdk: '10.0.x'
          - framework: net11.0
            sdk: '11.0.x'

    defaults:
      run:
        shell: pwsh
    env:
      TARGET_FRAMEWORK: ${{ matrix.framework }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        id: dotnet
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Select the matrix SDK
        env:
          SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: dotnet new globaljson --sdk-version $env:SDK_VERSION --roll-forward disable

      - name: Install Linux QUIC dependency
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source /etc/os-release
          curl --fail --silent --show-error --location \
            "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" \
            --output "$RUNNER_TEMP/packages-microsoft-prod.deb"
          sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
          sudo apt-get update
          sudo apt-get install -y libmsquic

      - name: Restore
        run: dotnet restore Netty.NET.sln "-p:TargetFrameworks=$env:TARGET_FRAMEWORK"

      - name: Build
        # The HTTP/2 assertion tests require Debug.Assert to be enabled.
        run: dotnet build Netty.NET.sln --configuration Debug --no-restore "-p:TargetFrameworks=$env:TARGET_FRAMEWORK"

      - name: Test
        run: dotnet test Netty.NET.sln --configuration Debug --framework $env:TARGET_FRAMEWORK --no-build --no-restore "-p:TargetFrameworks=$env:TARGET_FRAMEWORK" -m:1 --logger trx

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.framework }}
          path: test/**/TestResults/*.trx
          if-no-files-found: ignore
